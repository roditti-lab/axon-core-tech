<img id="vis" src="../media/photos/ai-core-vis.jpg" alt="">
<img id="ir" src="../media/photos/ai-core-ir.jpg" alt="">
<canvas id="c"></canvas><script>
'use strict';

const C = { cyan: '#53C6DD', steel: '#A3C0D6', red: '#FF5A4E', green: '#00FF88', white: '#FFFFFF', ink: '#051726', tile: '#0B2944', deep: '#071E33' };

/* ---------- layout (fixed: the deck's HTML names sit on these places) ---------- */
const ROWS = [362, 500, 638, 776, 914];                                  // input rows, centre y
const PAN = { x: 128, w: 300, h: 124 };                                  // the input panels
const CORE = { x: 1010, y: 430, w: 380, h: 300 };
const PORT = [465, 525, 585, 645, 705];                                  // where each lane enters the computer
const FV = { x: 1452, y: 300, w: 340, h: 191 };                         // the fused view (real footage)
const OROW = [520, 624, 728, 832], OH = 88;                              // the outputs' rows
const TLA = [0.5, 0.75, 1.0, 1.25, 1.5], T_CORE = 2.2, T_OUT = 3.0, TO = [3.6, 4.4, 5.2, 6.0];

/* ---------- the real feeds: 20 frames from Axon's ForceField test (day and thermal at the same moments) ---------- */
// the tracking box ForceField drew on each day frame, as fractions of the frame (x0, y0, x1, y1): the drone is inside it
const BOXV = [[0.0877, 0.0278, 0.3361, 0.4007], [0.0835, 0.0686, 0.333, 0.4416], [0.0981, 0.1317, 0.3476, 0.5046], [0.0939, 0.1391, 0.3434, 0.5121],
  [0.1086, 0.1354, 0.357, 0.5083], [0.1399, 0.1243, 0.3873, 0.4954], [0.1795, 0.1131, 0.428, 0.4842], [0.2296, 0.102, 0.4791, 0.475],
  [0.2923, 0.1187, 0.5407, 0.4898], [0.3549, 0.1335, 0.6023, 0.5083], [0.4259, 0.2616, 0.6743, 0.6345], [0.4969, 0.3858, 0.7463, 0.7607],
  [0.5073, 0.4545, 0.7547, 0.8275], [0.5157, 0.5213, 0.7641, 0.8942], [0.5219, 0.551, 0.7714, 0.9239], [0.5261, 0.5399, 0.7756, 0.9128],
  [0.5313, 0.5288, 0.7797, 0.9017], [0.5188, 0.5083, 0.7672, 0.8831], [0.5052, 0.4898, 0.7547, 0.8609], [0.4916, 0.4954, 0.7401, 0.8683]];
const NF = 20, FW = 320, FH = 180, ZM = 1.45, WW = FW / ZM, WH = FH / ZM;
const fIdx = t => { const k = Math.floor(Math.max(0, t) * 12.5) % (2 * NF - 2); return k < NF ? k : 2 * NF - 2 - k; };   // ping-pong at 12.5 fps
const fSrc = i => [(i % 5) * FW, Math.floor(i / 5) * FH];
const boxC = i => { const b = BOXV[i]; return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2, b[2] - b[0], b[3] - b[1]]; };
function win(i) { const [bx, by] = boxC(i); return [clamp(bx * FW - WW / 2, 0, FW - WW), clamp(by * FH - WH / 2, 0, FH - WH)]; }

/* ---------- canvas ---------- */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const IMG = { vis: document.getElementById('vis'), ir: document.getElementById('ir') };
const ok = im => im.complete && im.naturalWidth > 0;
let K = 1, OX = 0, OY = 0, NZ = null, SW = null, SG = null, SPEC = null;
function size() {
  const D = Math.min(2, Math.max(1.25, window.devicePixelRatio || 1)), w = Math.round(innerWidth * D), h = Math.round(innerHeight * D);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  K = Math.min(cv.width / 1920, cv.height / 1080); OX = (cv.width - 1920 * K) / 2; OY = (cv.height - 1080 * K) / 2;
}
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function glow(x, y, r, color, a) { if (a <= 0.005) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(color, a)); gr.addColorStop(1, rgba(color, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
function text(s, x, y, size, color, align, alpha, sp) {
  if (alpha <= 0.01) return; g.globalAlpha = alpha; g.font = '700 ' + size + 'px ' + FONT; g.letterSpacing = (sp == null ? 1.5 : sp) + 'px';
  g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillStyle = color; g.fillText(s, x, y); g.letterSpacing = '0px'; g.globalAlpha = 1;
}
const LW = 2.4;
function ink(a, fill) { g.globalAlpha = a; g.lineWidth = LW; g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = C.cyan; g.fillStyle = fill || C.tile; }
function fs() { g.fill(); g.stroke(); }
function noiseTile() { const o = document.createElement('canvas'); o.width = 160; o.height = 90; const c = o.getContext('2d'), im = c.createImageData(160, 90), r = rng(77);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255 | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  c.putImageData(im, 0, 0); return o; }
const laneA = (i, t) => sm((t - TLA[i]) / 0.35);                          // a lane comes alive

/* ---------- the inputs: one panel per sensor, its own kind of data ---------- */
function panel(i, t, draw) {
  const x = PAN.x, y = ROWS[i] - PAN.h / 2, w = PAN.w, h = PAN.h, a = laneA(i, t), base = sm(t / 0.5);
  g.globalAlpha = base; g.fillStyle = 'rgba(3,14,24,0.9)'; rr(x - 4, y - 4, w + 8, h + 8, 7); g.fill(); g.globalAlpha = 1;
  g.save(); rr(x, y, w, h, 4); g.clip();
  g.fillStyle = C.ink; g.fillRect(x, y, w, h);
  if (a > 0) { g.globalAlpha = a; draw(x, y, w, h); g.globalAlpha = 1;
    if (!NZ) NZ = noiseTile(); const r = rng((t * 25) | 0); g.globalAlpha = 0.06 * a; g.drawImage(NZ, r() * 60, r() * 30, 100, 60, x, y, w, h); g.globalAlpha = 1;
    const u = t - TLA[i]; if (u < 0.3) { g.fillStyle = 'rgba(223,229,236,' + (0.5 * (1 - u / 0.3)) + ')'; g.fillRect(x, y, w, h); } }
  g.restore();
  g.globalAlpha = base; g.strokeStyle = rgba(C.cyan, 0.2 + 0.4 * a); g.lineWidth = 1.4; rr(x, y, w, h, 4); g.stroke(); g.globalAlpha = 1;
}
function camFrame(im, i, x, y, w, h, follow) {                           // a camera frame, cropped to the panel and kept on the drone
  if (!ok(im)) return; const [sx, sy] = fSrc(i), ar = w / h, ch = FW / ar, cy = boxC(i)[1] * FH;
  const top = follow ? clamp(cy - ch / 2, 0, FH - ch) : (FH - ch) * 0.25;
  g.drawImage(im, sx, sy + top, FW, ch, x, y, w, h);
}
function hudCorners(x, y, w, h) { g.strokeStyle = 'rgba(223,229,236,0.5)'; g.lineWidth = 1.2; const L = 12;
  [[x + 6, y + 6, 1, 1], [x + w - 6, y + 6, -1, 1], [x + 6, y + h - 6, 1, -1], [x + w - 6, y + h - 6, -1, -1]].forEach(([px, py, sx, sy]) => { g.beginPath(); g.moveTo(px, py + sy * L); g.lineTo(px, py); g.lineTo(px + sx * L, py); g.stroke(); }); }
function drawVIS(t) { panel(0, t, (x, y, w, h) => { camFrame(IMG.vis, fIdx(t), x, y, w, h, true); hudCorners(x, y, w, h); }); }
function drawIR(t) { panel(1, t, (x, y, w, h) => { camFrame(IMG.ir, fIdx(t), x, y, w, h, false); hudCorners(x, y, w, h);
  const gr = g.createLinearGradient(0, y + 30, 0, y + h - 30); gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(1, '#000000');   // the white-hot scale
  g.fillStyle = gr; g.fillRect(x + w - 16, y + 30, 6, h - 60); g.strokeStyle = 'rgba(223,229,236,0.6)'; g.lineWidth = 1; g.strokeRect(x + w - 16, y + 30, 6, h - 60); }); }
function drawSWIR(t) { panel(2, t, (x, y, w, h) => {                       // monochrome, harder contrast: an illustration of SWIR
  if (!ok(IMG.vis)) return; if (!SW) { SW = document.createElement('canvas'); SW.width = FW; SW.height = FH; SG = SW.getContext('2d'); }
  const i = fIdx(t), [sx, sy] = fSrc(i); SG.filter = 'grayscale(1) contrast(2.2) brightness(0.62)'; SG.drawImage(IMG.vis, sx, sy, FW, FH, 0, 0, FW, FH); SG.filter = 'none';
  const ar = w / h, ch = FW / ar, cy = boxC(i)[1] * FH, top = clamp(cy - ch / 2, 0, FH - ch);
  g.drawImage(SW, 0, top, FW, ch, x, y, w, h); if (!NZ) NZ = noiseTile(); const r = rng(((t * 25) | 0) + 9); const ga = g.globalAlpha; g.globalAlpha = 0.1 * ga; g.drawImage(NZ, r() * 60, r() * 30, 100, 60, x, y, w, h); g.globalAlpha = ga;
  hudCorners(x, y, w, h); }); }
// the acoustic spectrogram: frequency up, time running left; a quadcopter's blade-pass tone and its harmonics
const SPW = 150, SPH = 62, SPDT = 0.03;
function drawAcoustic(t) { panel(3, t, (x, y, w, h) => {
  if (!SPEC) { SPEC = document.createElement('canvas'); SPEC.width = SPW; SPEC.height = SPH; }
  const sc = SPEC.getContext('2d'), im = sc.createImageData(SPW, SPH), d = im.data, tq = Math.floor(t / SPDT);
  for (let col = 0; col < SPW; col++) { const q = tq - (SPW - 1 - col), tau = q * SPDT, on = tau >= TLA[3] ? sm((tau - TLA[3]) / 0.4) : 0;
    const f0 = 182 + 7 * Math.sin(tau * 1.3) + 3 * Math.sin(tau * 3.1), am = 0.75 + 0.25 * Math.sin(tau * 2.2);
    for (let row = 0; row < SPH; row++) { const f = (SPH - 1 - row) / (SPH - 1) * 2000; let v = 0.1 + 0.22 * hash(q, row) + 0.12 * Math.exp(-f / 350);
      if (on > 0) for (let k = 1; k <= 9; k++) { const df = (f - k * f0) / 26; v += on * am * Math.pow(k, -0.55) * Math.exp(-df * df) * 1.05; }
      v = clamp(v, 0, 1); const o = (row * SPW + col) * 4;
      d[o] = v < 0.5 ? lerp(5, 22, v * 2) : lerp(22, v > 0.85 ? 255 : 83, (v - 0.5) * 2);
      d[o + 1] = v < 0.5 ? lerp(23, 92, v * 2) : lerp(92, v > 0.85 ? 255 : 198, (v - 0.5) * 2);
      d[o + 2] = v < 0.5 ? lerp(38, 124, v * 2) : lerp(124, v > 0.85 ? 255 : 221, (v - 0.5) * 2); d[o + 3] = 255; } }
  sc.putImageData(im, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(SPEC, x, y, w, h); }); }
// the radar: a sector scope with range rings, the beam sweeping, the drone's return and its short track
const RADT = { az: 0.36, r0: 0.86, vr: -0.035 };
function beam(t) { return 0.96 * Math.sin(t * TAU / 2.4); }              // radians from boresight, +-55 degrees
function drawRadar(t) { panel(4, t, (x, y, w, h) => {
  const cx = x + w / 2, cy = y + h - 8, R = h - 18, S = 0.96, ga = g.globalAlpha;
  g.fillStyle = 'rgba(6,30,46,0.9)'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, -Math.PI / 2 - S, -Math.PI / 2 + S); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(83,198,221,0.32)'; g.lineWidth = 1; [1 / 3, 2 / 3, 1].forEach(k => { g.beginPath(); g.arc(cx, cy, R * k, -Math.PI / 2 - S, -Math.PI / 2 + S); g.stroke(); });
  [-S, -S / 2, 0, S / 2, S].forEach(a => { g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(a) * R, cy - Math.cos(a) * R); g.stroke(); });
  const r = rng(5); for (let i = 0; i < 26; i++) { const a = (r() * 2 - 1) * S, rd = R * (0.06 + 0.22 * r()), f = 0.25 + 0.5 * hash(i, (t * 6) | 0);   // ground clutter
    g.fillStyle = 'rgba(83,198,221,' + f * 0.6 + ')'; g.fillRect(cx + Math.sin(a) * rd - 1, cy - Math.cos(a) * rd - 1, 2.4, 2.4); }
  const b = beam(t), b0 = beam(t - 0.12), dir = Math.sign(b - b0) || 1;
  for (let k = 0; k < 14; k++) { const a = b - dir * k * 0.035; g.fillStyle = 'rgba(83,198,221,' + (0.28 * (1 - k / 14)) + ')'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, -Math.PI / 2 + a - 0.02, -Math.PI / 2 + a + 0.02); g.closePath(); g.fill(); }
  g.strokeStyle = 'rgba(223,245,250,0.9)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(b) * R, cy - Math.cos(b) * R); g.stroke();
  let hit = -9; for (let s = 0; s <= 60; s++) { const ts = t - s * 0.04; if (Math.abs(beam(ts) - RADT.az) < 0.05) { hit = ts; break; } }   // the last time the beam crossed the drone
  const rd = R * (RADT.r0 + RADT.vr * t * 0.12), px = cx + Math.sin(RADT.az) * rd, py = cy - Math.cos(RADT.az) * rd, e = Math.exp(-(t - hit) / 0.9);
  for (let k = 1; k <= 5; k++) { const rk = R * (RADT.r0 + RADT.vr * (t - k * 0.9) * 0.12); g.fillStyle = 'rgba(223,245,250,' + 0.35 * (1 - k / 6) + ')'; g.beginPath(); g.arc(cx + Math.sin(RADT.az) * rk, cy - Math.cos(RADT.az) * rk, 1.6, 0, TAU); g.fill(); }
  g.globalAlpha = ga; glow(px, py, 14, C.cyan, 0.9 * e); g.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.7 * e) + ')'; g.beginPath(); g.arc(px, py, 3, 0, TAU); g.fill(); }); }
const INPUT = [drawVIS, drawIR, drawSWIR, drawAcoustic, drawRadar];

/* ---------- lanes: input to computer ---------- */
function lanePt(i, u) {                                                  // straight from the panel, then a curve into the port
  const y0 = ROWS[i], y1 = PORT[i], x0 = PAN.x + PAN.w + 4, xa = 820, x1 = CORE.x, L1 = xa - x0, L2 = 220, s = u * (L1 + L2);
  if (s <= L1) return [x0 + s, y0];
  const v = (s - L1) / L2, a = [xa, y0], b = [xa + 110, y0], c = [x1 - 110, y1], d = [x1, y1], q = 1 - v;
  return [q * q * q * a[0] + 3 * q * q * v * b[0] + 3 * q * v * v * c[0] + v * v * v * d[0], q * q * q * a[1] + 3 * q * q * v * b[1] + 3 * q * v * v * c[1] + v * v * v * d[1]];
}
function lane(i, t) {
  const on = sm((t - TLA[i]) / 0.6); if (on <= 0) return;
  g.globalAlpha = 1; g.lineWidth = 2; g.strokeStyle = rgba(C.cyan, 0.16 + 0.24 * on); g.beginPath();
  for (let k = 0; k <= 40; k++) { const p = lanePt(i, k / 40); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke();
  const head = eo((t - TLA[i]) / 1.1);                                   // the first data run, then a steady stream
  for (let k = 0; k < 4; k++) { const u = head < 1 ? head - k * 0.06 : ((t * 0.32 + k / 4 + i * 0.13) % 1); if (u < 0 || u > 1) continue;
    const p = lanePt(i, u); glow(p[0], p[1], 14, C.cyan, 0.55 * on); g.fillStyle = rgba(C.cyan, on); g.beginPath(); g.arc(p[0], p[1], 3.2, 0, TAU); g.fill(); }

/* ---------- the Axon AI core: a rugged computer, its GPU lighting up ---------- */

  for (let k = 0; k < 17; k++) { const fx = x + 30 + k * 20; g.beginPath(); g.moveTo(fx, y - 16); g.lineTo(fx, y); g.stroke(); }   // heat-sink fins
  g.beginPath(); g.moveTo(x + 22, y - 16); g.lineTo(x + w - 22, y - 16); g.stroke();
  rr(x, y, w, h, 18); fs();
  rr(x + 14, y + 14, w - 28, h - 28, 10); g.stroke();
  PORT.forEach(py => { rr(x - 10, py - 9, 20, 18, 3); fs(); });          // one connector per lane
  rr(x + w - 10, 571, 20, 18, 3); fs();                                 // the output connector
  const chip = { x: cx - 74, y: y + h / 2 - 74, s: 148 };                 // the GPU, its pins, its cores
  for (let k = 0; k < 7; k++) { const o = chip.x + 14 + k * 20; g.beginPath(); g.moveTo(o, chip.y - 12); g.lineTo(o, chip.y); g.moveTo(o, chip.y + chip.s); g.lineTo(o, chip.y + chip.s + 12); g.stroke();
    const p = chip.y + 14 + k * 20; g.beginPath(); g.moveTo(chip.x - 12, p); g.lineTo(chip.x, p); g.moveTo(chip.x + chip.s, p); g.lineTo(chip.x + chip.s + 12, p); g.stroke(); }

    g.globalAlpha = a; g.fillStyle = rgba(C.cyan, lit * (0.25 + 0.5 * sh)); g.fillRect(px, py, cs - 6, cs - 6);

/* ---------- out of the core: the fused view (real footage) and the four outputs ---------- */
function bez(a, b, u) { const q = 1 - u, c1 = [a[0] + 40, a[1]], c2 = [b[0] - 40, b[1]];

function wire(a, b, on, t, k) {

  for (let j = 0; j <= 24; j++) { const p = bez(a, b, j / 24); j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); } g.stroke();
  const u = (t * 0.5 + k * 0.23) % 1, p = bez(a, b, u); g.fillStyle = rgba(C.cyan, on); g.beginPath(); g.arc(p[0], p[1], 3, 0, TAU); g.fill();

function fused(t) {

  const i = fIdx(t), [wx, wy] = win(i), map = (fx, fy) => [x + (fx * FW - wx) / WW * w, y + (fy * FH - wy) / WH * h];
  g.globalAlpha = a; g.fillStyle = 'rgba(3,14,24,0.9)'; rr(x - 5, y - 5, w + 10, h + 10, 8); g.fill();
